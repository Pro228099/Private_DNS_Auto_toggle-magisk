# Private DNS Auto Toggle configuration
# This file is sourced by the module. Format: KEY=value (no spaces around =).

# React to VPN connect/disconnect events from the system log instead of polling
# on a timer. Recommended: the module then costs nothing while idle (true/false).
EVENT_MODE=true

# Polling interval used when EVENT_MODE=false, in seconds.
INTERVAL=5

# Safety-net poll interval (seconds). A slow poll runs alongside the event
# stream so a silent or dead logcat can never leave the module stuck. It logs
# nothing while the events work, so the cost is one lightweight check per period.
POLL_INTERVAL=30

# Fast safety-net interval (seconds) used only while a VPN is active and we are
# holding Private DNS off. Makes the restore on disconnect snappy even if the log
# event was missed, and is still silent.
POLL_INTERVAL_ACTIVE=3

# Delay before restoring Private DNS after the tunnel interface disappears on a
# disconnect (seconds). The interface can linger for a moment after the log line,
# and restoring too early risks flipping Private DNS back on while the tunnel is
# still up. The disable direction is not delayed -- it runs as soon as the log
# says the VPN connected.
SETTLE=1

# How long (seconds) the event path waits, at most, for the cheap interface probe
# to agree with a log event before applying the direction the log reported anyway.
# The probe is now interface-only (no slow dumpsys) on this path, so this is a
# safety bound, not the usual cost.
EVENT_WAIT=3

# Extra delay after boot before the first check, in seconds.
CHECK_INTERVAL=10

# Start the background watcher automatically at boot (true/false).
AUTO_START=true

# Restore the saved Private DNS setting when the module is uninstalled (true/false).
RESTORE_ON_EXIT=true

# DNS mode applied while a VPN is active. Android values: off / opportunistic / hostname.
DNS_MODE=off

# Write a log to /data/adb/private_dns_auto_toggle.log (true/false).
LOG=true

# Log what would happen without changing any setting (true/false).
DRY_RUN=false
