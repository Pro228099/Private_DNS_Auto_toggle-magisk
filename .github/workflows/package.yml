name: Package Magisk module

# A release pushes a commit to main and then a tag; listening to both made every
# version run the whole pipeline twice. The pipeline now hangs off the tag alone
# (that is the artifact that matters), with PRs and manual dispatch as the other
# entry points, so one version produces exactly one run.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Collapse duplicate runs for the same ref instead of queueing them.
concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax check
        run: |
          for f in common.sh service.sh action.sh uninstall.sh customize.sh; do
            sh -n "$f" || exit 1
          done
          echo "syntax OK"
      - name: Validate module.prop
        run: |
          for key in id name version versionCode author description; do
            grep -q "^$key=" module.prop || { echo "missing $key"; exit 1; }
          done
          grep -qE '^id=[a-zA-Z0-9._-]+$' module.prop
          grep -q '^updateJson=https://' module.prop || { echo "updateJson missing"; exit 1; }
          echo "module.prop OK"
      - name: Validate update.json
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("update.json"))
          for k in ("version", "versionCode", "zipUrl", "changelog"):
              assert k in d, "update.json missing " + k
          assert isinstance(d["versionCode"], int), "versionCode must be an int"
          assert d["zipUrl"].startswith("https://"), "zipUrl must be https"
          print("update.json OK:", d["version"], d["versionCode"])
          PY
      - name: Install mksh (Android's /system/bin/sh)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mksh
      - name: Run test suite (sh + mksh)
        run: |
          sh tests/all.sh
          SHELL_BIN=mksh sh tests/all.sh

  package:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build zip
        run: |
          zip -r9 private_dns_auto_toggle.zip \
            module.prop common.sh service.sh action.sh uninstall.sh customize.sh \
            private_dns_auto_toggle.conf update.json META-INF
          unzip -l private_dns_auto_toggle.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: private_dns_auto_toggle
          path: private_dns_auto_toggle.zip
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: private_dns_auto_toggle.zip
          generate_release_notes: true
      # Keep update.json in step with the newest release so the Magisk app's
      # update button always resolves. Regenerated from module.prop, which is the
      # source of truth for version/versionCode.
      - name: Refresh update.json on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json, os
          prop = dict(
              line.rstrip("\n").split("=", 1)
              for line in open("module.prop")
              if "=" in line
          )
          tag = os.environ["GITHUB_REF_NAME"]
          base = "https://github.com/Pro228099/Private_DNS_Auto_toggle-magisk"
          data = {
              "version": prop["version"],
              "versionCode": int(prop["versionCode"]),
              "zipUrl": f"{base}/releases/download/{tag}/private_dns_auto_toggle.zip",
              "changelog": "https://cdn.jsdelivr.net/gh/Pro228099/Private_DNS_Auto_toggle-magisk@main/CHANGELOG.md",
          }
          with open("update.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          print("update.json ->", data["version"], data["versionCode"])
          PY
          git config user.name openhands
          git config user.email openhands@all-hands.dev
          git add update.json
          git diff --cached --quiet || git commit -m "ci: refresh update.json for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
      # Purge the jsDelivr cache so module.prop's updateJson (@main) serves the
      # JSON just committed, not a stale copy.
      - name: Purge jsDelivr cache
        if: startsWith(github.ref, 'refs/tags/v')
        run: curl -sf "https://purge.jsdelivr.net/gh/Pro228099/Private_DNS_Auto_toggle-magisk@main/update.json" || true
